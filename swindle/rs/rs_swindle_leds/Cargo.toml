[package]
name = "rs_swindle_leds"
version = "0.1.0"
edition.workspace = true

# Background LED activity of Swindle (what used to be loop() in
# src/swindle_gd32.cpp and src/swindle_gd32_ws2812.cpp).
#
# The variant is selected by cargo features, set by swindle/rs/CMakeLists.txt:
#   bluepill            GD32F3 / CH32V3xx boards
#   bluepill + ws2812   same, with a single WS2812B LED (CMake: USE_WS2812)
# RP2040 / RP2350 : no feature, the crate is empty (their LED code is still in C++).
#
# The plain variant is platform-neutral: pins from the probe board table, driven
# through the esprit `GpioPin` trait, so it names no MCU backend crate and this
# manifest carries no path into esprit beyond the workspace `rust_esprit`. Only the
# WS2812B variant names its driver crate (`ws2812b`), which is deliberate.

[features]
bluepill = [
    "dep:rust_esprit",
    "rust_esprit/bluepill",
]
bluepill48 = ["bluepill", "rust_esprit/bluepill48", "ws2812b?/bluepill48", "dep:rs_swindle_board", "rs_swindle_board/ln48"]
bluepill64 = ["bluepill", "rust_esprit/bluepill64", "ws2812b?/bluepill64", "dep:rs_swindle_board", "rs_swindle_board/ln64"]
ws2812 = ["bluepill", "dep:ws2812b"]

[dependencies]
rust_esprit = { workspace = true, optional = true }
# WS2812B strip driver: an esprit library, named explicitly (it is bluepill-backed
# inside). The plain LED variant does not need it.
ws2812b = { path = "../../../esprit/rust/libraries/ws2812b", optional = true }
# Probe board table: the LED pins are the board's, not this crate's (see registers.rs)
rs_swindle_board = { path = "../rs_swindle_board", optional = true }

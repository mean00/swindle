[workspace.package]
edition = "2024"

[workspace]
members=["rs_swindle","rs_swindle_wrapper"]
resolver = "2"

[workspace.dependencies]

# `default-features = false` on purpose: the platform backend (`bluepill` /
# `rp2040` / `esp32`) must be chosen explicitly by the consumer, otherwise an
# RP2040 build would silently pull in the bluepill Rust backends and fail to
# link (undefined `_rcuClockApb1`, …).  See esprit/rust/rp2xxx/README.md.
rust_esprit = { path = "../../esprit/rust/rust_esprit", default-features = false }
ufmt = { version = "0.2.0", default-features = false }
heapless = { version = "0.9.3", features = ["ufmt"]}

[profile.dev]
debug = true
opt-level       ="s" 
panic = "abort"
#lto = false  # no lto
#lto = "thin" # average
lto = "fat"  # strong lto
codegen-units = 1


[profile.release]
debug = true
opt-level       = "s"
panic = "abort"
codegen-units = 1
#lto = false  # no lto
lto = "thin" # average
#lto = "fat"  # strong lto



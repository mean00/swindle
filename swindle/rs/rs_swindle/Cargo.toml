[package]
name = "rsbmp"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
#default = ["native"]
std = []
native = ["dep:rust_esprit", "cdc"]
hosted = []
network = []

cdc = ["rust_esprit/cdc"]

# WCH CH32V0xx single-wire (SDI) debug support — CMake option SWINDLE_WITH_SDI,
# wired in swindle/rs/CMakeLists.txt. Off selects the no-SDI seam twin
# (src/riscv_extra_sdi_stubs.rs) in lib.rs.
sdi = []

# Inverted target nRST line — CMake option USE_INVERTED_NRST (a MOSFET on the
# board), wired in swindle/rs/CMakeLists.txt. Off: open drain / active low, on:
# push-pull / active high. Same switch that picks bmp_reset.cpp or
# bmp_reset_inv.cpp for the C++ SwdReset; the Rust half lives with the board
# table (rs_swindle_board/ln/reset_pin.rs), this only passes it through.
nrst_inverted = ["rs_swindle_board?/nrst_inverted"]

# Session-scoped static arena — CMake option SWINDLE_SESSION_ARENA, wired in
# swindle/rs/CMakeLists.txt. Off selects src/session_arena_stubs.rs, which
# forwards the swindle_session_* symbols to the heap (old behaviour, no .bss).
session_arena = []

# The Esprit logger (lnDebug.cpp) in Rust — CMake option USE_RUST_LOGGER, wired
# in swindle/rs/CMakeLists.txt. lnDebug.cpp is then not compiled (esprit/src),
# and rust_esprit/src/logger_c.rs provides the same C ABI. Bluepill only.
rust_logger = ["rust_esprit/rust_logger"]
# Which UART the log lines go out of when nothing is redirected (CMake
# LN_DEBUG_UART, C++ `LN_DEBUG_UART`); instance 0 unless one of these is set.
logger_uart1 = ["rust_esprit/logger_uart1"]
logger_uart2 = ["rust_esprit/logger_uart2"]

fake_std = ["rust_esprit/fake_std"]

# Platform backend selection for rust_esprit — see esprit/rust/rs_mcus/rp2xxx/README.md.
# Exactly one of these must be enabled by the consumer:
#   * `bluepill` — GD32 / CH32: rs_*_bluepill Rust peripheral backends
#   * `rp2040`   — RP2040 / RP2350: rp2xxx backends (the C++ bridges for
#                  timer / multi-pulse / ADC / I2C are not built there)
#   * `esp32`    — ESP32 C API
# swindle/rs/CMakeLists.txt picks it from USE_RP2040 / USE_RP2350.
bluepill = ["rust_esprit/bluepill"]
# Package of the bluepill chip (USE_48PIN_PACKAGE / USE_64PIN_PACKAGE), see rs_pinout48_bluepill
bluepill48 = ["rust_esprit/bluepill48", "dep:rs_swindle_board", "rs_swindle_board/ln48"]
bluepill64 = ["rust_esprit/bluepill64", "dep:rs_swindle_board", "rs_swindle_board/ln64"]
# RP2040 / RP2350 board table (swindle/rs/rs_swindle_board/src/rp2xxx/): selected by
# CMake from USE_RP_CARRIER, next to the `rp2040` platform feature. This is what
# brings the board crate into an RP build (the nRST line comes from it, like on LN).
rp_zero = ["rp2040", "dep:rs_swindle_board", "rs_swindle_board/rp_zero"]
rp_carrier = ["rp2040", "dep:rs_swindle_board", "rs_swindle_board/rp_carrier"]
rp2040 = ["rust_esprit/rp2040"]
esp32 = ["rust_esprit/esp32"]
use_esprit = ["dep:rust_esprit"]


[dependencies]
cty = "0.2.2"
rust_esprit = { workspace = true, optional = true }
# Probe board table (pinout / ADC / UART / USB / LEDs), enabled with the package
# features above — see swindle/rs/rs_swindle_board.
rs_swindle_board = { path = "../rs_swindle_board", optional = true }
ufmt = { workspace = true } #version = "*", default-features = false }
heapless =  { workspace = true } #{ version = "*", features = ["ufmt-impl"] }
numtoa = {version = "0.3.0"}
crc = { version ="3.0.1", features = []}
arraystring = { version = "0.3.0", default-features = false, features = [] }
strum = { version = "0.27.2", default-features = false, features = []}
strum_macros = { version = "0.27.2", default-features = false, features = []}
cfg-if = "1.0"
# CBOR codec for the RPC payload (see doc/rpc.md): both halves encode their
# parameters with it. `derive` is not needed — the generated code calls the
# encoder/decoder directly.
minicbor = { version = "2.3.1", default-features = false }
#
[lib]
name = "rsbmp"
path = "src/lib.rs"
crate-type = ["rlib"] # Creates static lib

